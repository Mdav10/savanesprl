<!DOCTYPE html>
<html>
<head>
    <title>SavaneSPRL</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial; margin: 20px; background: #f0f0f0; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        .result { background: #f8f9fa; padding: 10px; margin-top: 10px; white-space: pre-wrap; }
    </style>
</head>
<body>
<div class="container">
    <h1>🏦 SavaneSPRL Financial System</h1>
    <div id="loginSection">
        <h2>Login</h2>
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPassword" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>
    <div id="appSection" style="display:none;">
        <div id="tokenDisplay"></div>
        <button onclick="logout()">Logout</button>
        <div class="section">
            <h2>Dashboard</h2>
            <button onclick="getDashboard()">Get Dashboard</button>
            <div id="dashboardResult" class="result"></div>
        </div>
    </div>
</div>
<script>
const API_URL = 'https://savanesprl-api.onrender.com';
let authToken = localStorage.getItem('token');

if(authToken) {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('appSection').style.display = 'block';
}

async function login() {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    
    const response = await fetch(`${API_URL}/api/auth/login`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email, mot_de_passe: password})
    });
    const data = await response.json();
    
    if(response.ok) {
        localStorage.setItem('token', data.access_token);
        authToken = data.access_token;
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('appSection').style.display = 'block';
        alert('Login successful!');
    } else {
        alert('Login failed');
    }
}

function logout() {
    localStorage.clear();
    location.reload();
}

async function getDashboard() {
    const response = await fetch(`${API_URL}/api/dashboard/dg`, {
        headers: {'Authorization': `Bearer ${authToken}`}
    });
    const data = await response.json();
    document.getElementById('dashboardResult').innerHTML = JSON.stringify(data, null, 2);
}
</script>
</body>
</html>
